name: Security IDOR & Delegation Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        
      - name: Build Next.js
        run: npm run build
        working-directory: ./web

      - name: Start server in background
        run: npm run start -- -p 3000 &
        working-directory: ./web
        
      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run IDOR Test Script
        run: node tests/idor.test.js
        working-directory: ./web
