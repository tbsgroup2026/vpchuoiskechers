name: Security Gate — Diff Scan on Pull Request

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Security Scan
        id: scan
        run: |
          echo "🔒 TBS II Security Gate — Dang quet PR diff..."
          node scripts/security-scan.js --ci 2>&1 | tee scan-result.txt
          SCAN_EXIT=${PIPESTATUS[0]}
          echo "scan_exit=$SCAN_EXIT" >> $GITHUB_OUTPUT

      - name: Post Results as PR Comment
        if: always() && steps.scan.outputs.scan_exit != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.existsSync('scan-result.txt') ? fs.readFileSync('scan-result.txt', 'utf8') : 'No details';
            const body = "## 🔒 TBS II Security Gate Results\n\n```\n" + result.substring(0, 60000) + "\n```\n\n> ⚠️ Phat hien loi hong bao mat. Vui long sua truoc khi merge.";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Block on Critical/High Issues
        if: steps.scan.outputs.scan_exit == '1'
        run: |
          echo "⛔ PR bi chan — phat hien loi hong bao mat Critical/High."
          exit 1
