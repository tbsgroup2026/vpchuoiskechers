<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mất kết nối — TBS GROUP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08221a;
      color: #e2f0e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0,104,56,0.2);
      border: 2px solid rgba(0,104,56,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #fff; }
    p { font-size: 14px; color: rgba(226,240,232,0.65); line-height: 1.6; max-width: 320px; margin: 0 auto 28px; }
    button {
      background: #006838;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #00522c; }
    .brand {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(226,240,232,0.3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Mất kết nối mạng</h1>
  <p>Trang này không khả dụng khi offline. Vui lòng kiểm tra kết nối internet và thử lại.</p>
  <button onclick="window.location.reload()">Thử lại</button>
  <div class="brand">TBS GROUP · Chuỗi SKECHERS</div>
</body>
</html>
